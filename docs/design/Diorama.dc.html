.rosa-sw0 { animation: rosaSway 2.6s ease-in-out infinite }
.rosa-sw1 { animation: rosaSway 2.6s ease-in-out -0.9s infinite }
.rosa-sw2 { animation: rosaSway 2.6s ease-in-out -1.7s infinite }
@keyframes rosaSway { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(1.6px) } }
.rosa-gust { stroke-dasharray: 46 300; animation: rosaGust 5.5s linear infinite }

.rosa-flow { stroke-dasharray: 6 14; animation: rosaFlow 1.4s linear infinite }
@keyframes rosaFlow { to { stroke-dashoffset: -20 } }
.rosa-drop { opacity: 0; animation: rosaDrop 3.6s cubic-bezier(.45,.05,.55,.95) infinite }
.rosa-d1 { animation-delay: -0.9s } .rosa-d2 { animation-delay: -1.8s } .rosa-d3 { animation-delay: -2.7s }
@keyframes rosaDrop { 0% { transform: translate(0,0); opacity: 0 } 12% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translate(205px,102px); opacity: 0 } }
.rosa-pulse { transform-box: fill-box; transform-origin: center; animation: rosaPulse 1.8s ease-out infinite }
.rosa-pulse2 { animation-delay: -.9s }
@keyframes rosaPulse { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2); opacity: 0 } }
.rosa-bob { animation: rosaBob 1.8s ease-in-out infinite }
@keyframes rosaBob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
.rosa-jelly { transform-box: fill-box; transform-origin: 50% 100%; animation: rosaJelly 2.4s cubic-bezier(.45,0,.55,1) infinite }
@keyframes rosaJelly { 0%, 100% { transform: scale(1,1) } 30% { transform: scale(1.06,.94) } 60% { transform: scale(.97,1.04) } }
.rosa-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: rosaHop 1.1s cubic-bezier(.34,1.56,.64,1) infinite }
@keyframes rosaHop { 0%, 100% { transform: translateY(0) scale(1.06,.94) } 45% { transform: translateY(-10px) scale(.95,1.06) } }
.rosa-wipe { transform-box: fill-box; transform-origin: 0% 100%; animation: rosaWipe 1.6s ease-in-out infinite }
@keyframes rosaWipe { 0%, 100% { transform: rotate(0deg) } 50% { transform: rotate(-16deg) } }
.rosa-sweat { animation: rosaSweat 1.6s ease-in infinite }
@keyframes rosaSweat { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(14px); opacity: 0 } }
.rosa-shimmer { opacity: 0; animation: rosaShimmer 3s ease-in-out infinite }
@keyframes rosaShimmer { 0% { transform: translateY(8px); opacity: 0 } 50% { opacity: .75 } 100% { transform: translateY(-16px); opacity: 0 } }
.rosa-twinkle { transform-box: fill-box; transform-origin: center; animation: rosaTwinkle 2.2s ease-in-out infinite }
@keyframes rosaTwinkle { 0%, 100% { transform: scale(.3); opacity: 0 } 50% { transform: scale(1); opacity: 1 } }
.rosa-drift { animation: rosaDrift 14s ease-in-out infinite alternate }
@keyframes rosaDrift { from { transform: translateX(-14px) } to { transform: translateX(20px) } }
.rosa-dig { transform-box: fill-box; transform-origin: 0% 100%; animation: rosaDig 1.8s cubic-bezier(.65,0,.35,1) infinite }
@keyframes rosaDig { 0%, 100% { transform: rotate(0deg) } 50% { transform: rotate(18deg) } }
.rosa-rise { transform-box: fill-box; transform-origin: center; animation: rosaRise 2.4s cubic-bezier(.22,1,.36,1) .4s both }
@keyframes rosaRise { from { transform: scale(.2); opacity: 0 } to { transform: scale(1); opacity: .9 } }
.rosa-drive { animation: rosaDrive 8s linear infinite }
@keyframes rosaDrive { from { transform: translate(0,0) } to { transform: translate(264px,132px) } }
.rosa-rumble { animation: rosaRumble .35s ease-in-out infinite alternate }
@keyframes rosaRumble { from { transform: translateY(0) } to { transform: translateY(-1.2px) } }
.rosa-puff { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rosaPuff 2.4s ease-out infinite }
.rosa-puff2 { animation-delay: -1.2s }
@keyframes rosaPuff { 0% { transform: translate(0,0) scale(.4); opacity: .85 } 100% { transform: translate(10px,-30px) scale(1.6); opacity: 0 } }
.rosa-seed { animation: rosaSeed .9s ease-in infinite }
@keyframes rosaSeed { from { transform: translateY(0); opacity: 1 } to { transform: translateY(10px); opacity: 0 } }
.rosa-wag { transform-box: fill-box; transform-origin: 100% 100%; animation: rosaWag .4s ease-in-out infinite alternate }
@keyframes rosaWag { from { transform: rotate(-14deg) } to { transform: rotate(18deg) } }
.rosa-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: rosaJelly 3s cubic-bezier(.45,0,.55,1) -1s infinite }
.rosa-spin { transform-box: fill-box; transform-origin: center; animation: rosaSpin 3.2s linear infinite }
@keyframes rosaSpin { to { transform: rotate(360deg) } }
.rosa-wet { animation: rosaWet 4s ease-in-out infinite alternate }
.rosa-glow { animation: rosaWet 1.6s ease-in-out infinite alternate }
@keyframes rosaWet { from { opacity: .45 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { svg * { animation: none !important } .rosa-drop { opacity: 1 } .rosa-puff { opacity: .5 } }
</style>

<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["hero","susza","zastawka","miedzyplon","nawadnianie"],"default":"susza"},"labels":{"editor":"boolean","default":true},"$preview":{"width":900,"height":640}}'>
